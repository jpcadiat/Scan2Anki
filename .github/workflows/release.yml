name: Release

# Push a tag such as v1.2.3 to build a signed APK and publish it as a GitHub Release.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Derive version from tag
        id: version
        run: |
          name="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "${name%%-*}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SCAN2ANKI_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret SCAN2ANKI_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Run unit tests and build signed release APK
        env:
          SCAN2ANKI_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          SCAN2ANKI_KEYSTORE_PASSWORD: ${{ secrets.SCAN2ANKI_KEYSTORE_PASSWORD }}
          SCAN2ANKI_KEY_ALIAS: ${{ secrets.SCAN2ANKI_KEY_ALIAS }}
          SCAN2ANKI_KEY_PASSWORD: ${{ secrets.SCAN2ANKI_KEY_PASSWORD }}
        run: >
          ./gradlew testDebugUnitTest assembleRelease
          -PversionName=${{ steps.version.outputs.name }}
          -PversionCode=${{ steps.version.outputs.code }}

      - name: Verify signature
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="scan2anki-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" --title "Scan2Anki ${{ steps.version.outputs.name }}" --generate-notes
